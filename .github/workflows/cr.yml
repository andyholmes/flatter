name: Container Registry

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  pull_request:
    branches: [main]
    paths: [Dockerfile]
  schedule:
    # Once a week
    - cron: "0 0 * * */7"
  workflow_dispatch:

jobs:
  build-base:
    name: Build Base Image
    # aarch64 builds fail on ubuntu-24.04
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/flatter-base:latest

  build:
    name: Build
    needs: [build-base]
    # aarch64 builds fail on ubuntu-24.04
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        runtime:
          # freedesktop.org
          #
          # These are images for the freedesktop.org runtime, and those that
          # add a few packages to support additional languages and so on.
          - name: freedesktop
            tag: 24.08
            flathub: >
              org.freedesktop.Platform/x86_64/24.08
              org.freedesktop.Sdk/x86_64/24.08
              org.freedesktop.Platform/aarch64/24.08
              org.freedesktop.Sdk/aarch64/24.08

          - name: freedesktop
            tag: 25.08
            flathub: >
              org.freedesktop.Platform/x86_64/25.08
              org.freedesktop.Sdk/x86_64/25.08
              org.freedesktop.Platform/aarch64/25.08
              org.freedesktop.Sdk/aarch64/25.08

          - name: rust
            tag: 24.08
            flathub: >
              org.freedesktop.Platform/x86_64/24.08
              org.freedesktop.Sdk/x86_64/24.08
              org.freedesktop.Platform/aarch64/24.08
              org.freedesktop.Sdk/aarch64/24.08
              org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/x86_64/24.08
              org.freedesktop.Sdk.Extension.llvm18/aarch64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/aarch64/24.08

          - name: rust
            tag: 25.08
            flathub: >
              org.freedesktop.Platform/x86_64/25.08
              org.freedesktop.Sdk/x86_64/25.08
              org.freedesktop.Platform/aarch64/25.08
              org.freedesktop.Sdk/aarch64/25.08
              org.freedesktop.Sdk.Extension.llvm20/x86_64/25.08
              org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08
              org.freedesktop.Sdk.Extension.llvm20/aarch64/25.08
              org.freedesktop.Sdk.Extension.rust-stable/aarch64/25.08

          - name: rust-nightly
            tag: 24.08
            flathub: >
              org.freedesktop.Platform/x86_64/24.08
              org.freedesktop.Sdk/x86_64/24.08
          #     org.freedesktop.Platform/aarch64/24.08
          #     org.freedesktop.Sdk/aarch64/24.08
              org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08
              org.freedesktop.Sdk.Extension.rust-nightly/x86_64/24.08
          #     org.freedesktop.Sdk.Extension.llvm18/aarch64/24.08
          #     org.freedesktop.Sdk.Extension.rust-nightly/aarch64/24.08

          - name: rust-nightly
            tag: 25.08
            flathub: >
              org.freedesktop.Platform/x86_64/25.08
              org.freedesktop.Sdk/x86_64/25.08
          #     org.freedesktop.Platform/aarch64/25.08
          #     org.freedesktop.Sdk/aarch64/25.08
              org.freedesktop.Sdk.Extension.llvm20/x86_64/25.08
              org.freedesktop.Sdk.Extension.rust-nightly/x86_64/25.08
          #     org.freedesktop.Sdk.Extension.llvm20/aarch64/25.08
          #     org.freedesktop.Sdk.Extension.rust-nightly/aarch64/25.08

          # GNOME
          #
          # These are images for the GNOME runtime, and those that add a few
          # things for e.g. Rust bindings.
          - name: gnome
            tag: 48
            flathub: >
              org.gnome.Platform/x86_64/48
              org.gnome.Sdk/x86_64/48
              org.gnome.Platform/aarch64/48
              org.gnome.Sdk/aarch64/48

          - name: gnome
            tag: 49
            flathub: >
              org.gnome.Platform/x86_64/49
              org.gnome.Sdk/x86_64/49
              org.gnome.Platform/aarch64/49
              org.gnome.Sdk/aarch64/49

          - name: gnome
            tag: master
            gnome_nightly: >
              org.gnome.Platform/x86_64/master
              org.gnome.Sdk/x86_64/master
              org.gnome.Platform/aarch64/master
              org.gnome.Sdk/aarch64/master

          - name: gnome-rust
            tag: 48
            flathub: >
              org.gnome.Platform/x86_64/48
              org.gnome.Sdk/x86_64/48
              org.gnome.Platform/aarch64/48
              org.gnome.Sdk/aarch64/48
              org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/x86_64/24.08
              org.freedesktop.Sdk.Extension.llvm18/aarch64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/aarch64/24.08

          - name: gnome-rust
            tag: 49
            flathub: >
              org.gnome.Platform/x86_64/49
              org.gnome.Sdk/x86_64/49
              org.gnome.Platform/aarch64/49
              org.gnome.Sdk/aarch64/49
              org.freedesktop.Sdk.Extension.llvm20/x86_64/25.08
              org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08
              org.freedesktop.Sdk.Extension.llvm20/aarch64/25.08
              org.freedesktop.Sdk.Extension.rust-stable/aarch64/25.08

          - name: gnome-typescript
            tag: 48
            flathub: >
              org.gnome.Platform/x86_64/48
              org.gnome.Sdk/x86_64/48
              org.gnome.Platform/aarch64/48
              org.gnome.Sdk/aarch64/48
              org.freedesktop.Sdk.Extension.node20/x86_64/24.08
              org.freedesktop.Sdk.Extension.typescript/x86_64/24.08

          - name: gnome-typescript
            tag: 49
            flathub: >
              org.gnome.Platform/x86_64/49
              org.gnome.Sdk/x86_64/49
              org.gnome.Platform/aarch64/49
              org.gnome.Sdk/aarch64/49
              org.freedesktop.Sdk.Extension.node20/x86_64/25.08
              org.freedesktop.Sdk.Extension.typescript/x86_64/25.08

          - name: gnome-vala
            tag: 48
            flathub: >
              org.gnome.Platform/x86_64/48
              org.gnome.Sdk/x86_64/48
              org.gnome.Platform/aarch64/48
              org.gnome.Sdk/aarch64/48
              org.freedesktop.Sdk.Extension.vala/x86_64/24.08

          - name: gnome-vala
            tag: 49
            flathub: >
              org.gnome.Platform/x86_64/49
              org.gnome.Sdk/x86_64/49
              org.gnome.Platform/aarch64/49
              org.gnome.Sdk/aarch64/49
              org.freedesktop.Sdk.Extension.vala/x86_64/25.08

          # elementary
          #
          # These are images for the elementary OS runtimes. The maintainer
          # doesn't use these, but feel free to open a PR if out-of-date.
          - name: elementary
            tag: 7.3
            elementary: >
              io.elementary.Platform/x86_64/7.3
              io.elementary.Sdk/x86_64/7.3
              io.elementary.Platform/aarch64/7.3
              io.elementary.Sdk/aarch64/7.3

          - name: elementary
            tag: 8.2
            elementary: >
              io.elementary.Platform/x86_64/8.2
              io.elementary.Sdk/x86_64/8.2
              io.elementary.Platform/aarch64/8.2
              io.elementary.Sdk/aarch64/8.2

          - name: elementary
            tag: daily
            elementary: >
              io.elementary.Platform/x86_64/daily
              io.elementary.Sdk/x86_64/daily
              io.elementary.Platform/aarch64/daily
              io.elementary.Sdk/aarch64/daily

          # Workbench
          #
          # This is a special image for Workbench, that includes quite a few
          # language extensions.
          - name: workbench
            tag: master
            flathub: >
              org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/x86_64/24.08
              org.freedesktop.Sdk.Extension.llvm18/aarch64/24.08
              org.freedesktop.Sdk.Extension.rust-stable/aarch64/24.08
              org.freedesktop.Sdk.Extension.node20/x86_64/24.08
              org.freedesktop.Sdk.Extension.typescript/x86_64/24.08
              org.freedesktop.Sdk.Extension.vala/x86_64/24.08
            gnome_nightly: >
              org.gnome.Platform/x86_64/master
              org.gnome.Sdk/x86_64/master
              org.gnome.Platform/aarch64/master
              org.gnome.Sdk/aarch64/master

          # KDE
          #
          # These are images for the Qt/KDE runtimes. The maintainer doesn't use
          # these, but feel free to open a PR if out-of-date.
          - name: qt
            tag: 5.15-24.08
            flathub: >
              org.kde.Platform/x86_64/5.15-24.08
              org.kde.Sdk/x86_64/5.15-24.08
              org.kde.Platform/aarch64/5.15-24.08
              org.kde.Sdk/aarch64/5.15-24.08

          - name: qt
            tag: 5.15-25.08
            flathub: >
              org.kde.Platform/x86_64/5.15-25.08
              org.kde.Sdk/x86_64/5.15-25.08
              org.kde.Platform/aarch64/5.15-25.08
              org.kde.Sdk/aarch64/5.15-25.08

          - name: kde
            tag: 6.9
            flathub: >
              org.kde.Platform/x86_64/6.9
              org.kde.Sdk/x86_64/6.9
              org.kde.Platform/aarch64/6.9
              org.kde.Sdk/aarch64/6.9

          - name: kde
            tag: '6.10'
            flathub: >
              org.kde.Platform/x86_64/6.10
              org.kde.Sdk/x86_64/6.10
              org.kde.Platform/aarch64/6.10
              org.kde.Sdk/aarch64/6.10
      fail-fast: false

    steps:
      - name: Cleanup
        run: |
          sudo rm -rf /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/local/lib/android
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Checkout
        uses: actions/checkout@v6

      - name: Login
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Generate Dockerfile
        run: |
          cat >> ${{ matrix.runtime.name }}.Dockerfile << EOF
          # syntax = docker/dockerfile:experimental
          FROM ghcr.io/${{ github.repository }}/flatter-base:latest
          EOF

          if [ -n "${{ matrix.runtime.gnome_nightly }}" ]; then
          cat >> ${{ matrix.runtime.name }}.Dockerfile << EOF
          RUN --security=insecure flatpak install -y --noninteractive \
                                          gnome-nightly \
                                          ${{ matrix.runtime.gnome_nightly }}
          EOF
          fi

          if [ -n "${{ matrix.runtime.flathub_beta }}" ]; then
          cat >> ${{ matrix.runtime.name }}.Dockerfile << EOF
          RUN --security=insecure flatpak install -y --noninteractive \
                                          flathub-beta \
                                          ${{ matrix.runtime.flathub_beta }}
          EOF
          fi

          if [ -n "${{ matrix.runtime.flathub }}" ]; then
          cat >> ${{ matrix.runtime.name }}.Dockerfile << EOF
          RUN --security=insecure flatpak install -y --noninteractive \
                                          flathub \
                                          ${{ matrix.runtime.flathub }}
          EOF
          fi

          if [ -n "${{ matrix.runtime.elementary }}" ]; then
          cat >> ${{ matrix.runtime.name }}.Dockerfile << EOF
          RUN --security=insecure flatpak install -y --noninteractive \
                                          elementary \
                                          ${{ matrix.runtime.elementary }}
          EOF
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          allow: security.insecure
          context: .
          file: ${{ matrix.runtime.name }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/${{ matrix.runtime.name }}:${{ matrix.runtime.tag }}
